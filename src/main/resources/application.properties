spring.application.name=gateway

server.port=9000

auth.host=localhost
auth.port=8081

account.host=localhost
account.port=8082

jwt.secret=super-secret-key-change-this-in-production-123456

# Elimina los valores duplicados de CORS que vengan desde los microservicios internos
spring.cloud.gateway.mvc.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.mvc.default-filters[0].args.headers=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.mvc.default-filters[0].args.strategy=RETAIN_UNIQUE
