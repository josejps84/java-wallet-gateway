spring.application.name=gateway
server.port=${SERVER_PORT:9000}

# Secrets come from environment variables. For local runs, put them in a .env file
# at the repo root (see .env.example); it is git-ignored.
spring.config.import=optional:file:.env[.properties]

# Must be the same secret used by the users and account services
jwt.secret=${JWT_SECRET}

auth.url=${AUTH_URL:http://localhost:8081}
account.url=${ACCOUNT_URL:http://localhost:8082}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Drop duplicated CORS headers coming back from the downstream services
spring.cloud.gateway.mvc.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.mvc.default-filters[0].args.headers=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.mvc.default-filters[0].args.strategy=RETAIN_UNIQUE
